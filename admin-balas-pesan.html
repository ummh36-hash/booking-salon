<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Flawless - Balas Pesan Pelanggan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f5f2ec;--white:#fff;--ink:#25231f;--muted:#77736d;--gold:#b99a68;--line:#e9e4dc;--gold-light:#faf6f0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}

/* Card Container */
.reply-card {
  background: var(--white);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(40,30,20,.08);
  width: 100%;
  max-width: 520px;
  padding: 28px;
  border: 1px solid var(--line);
  position: relative;
}

/* Card Header */
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
}
.card-title { font: 600 20px "Playfair Display", serif; color: var(--ink); }
.close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); text-decoration: none; line-height: 1; }

/* Form Group */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.form-control {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: "DM Sans", sans-serif;
  font-size: 12px;
  background: #faf8f5;
  color: var(--ink);
  transition: border-color 0.2s;
}
.form-control:focus {
  outline: none;
  border-color: var(--gold);
  background: var(--white);
}
textarea.form-control {
  resize: vertical;
  min-height: 120px;
}

/* Tombol Aksi */
.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.btn {
  flex: 1;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 14px;
  font: 700 12px "DM Sans", sans-serif;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  letter-spacing: 0.5px;
  transition: background 0.2s;
  display: inline-block;
}
.btn:hover { background: #a98855; }
.btn-outline {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-outline:hover { background: var(--gold-light); border-color: var(--gold); }
</style>
</head>
<body>

<div class="reply-card">
  <!-- Header -->
  <div class="card-header">
    <h2 class="card-title">Balas Pesan Pelanggan</h2>
    <a href="admin-pesan.html" class="close-btn">&times;</a>
  </div>

  <!-- Form Isi Jawaban -->
  <form id="replyForm">
    
    <!-- Kepada Email -->
    <div class="form-group">
      <label>Email Tujuan (Pelanggan)</label>
      <input type="email" id="recipientEmail" class="form-control" value="clarashinta@gmail.com" readonly>
    </div>

    <!-- Subjek -->
    <div class="form-group">
      <label>Subjek Pesan</label>
      <input type="text" id="emailSubject" class="form-control" value="Balasan: Pertanyaan Layanan Studio Flawless">
    </div>

    <!-- Isi Jawaban -->
    <div class="form-group">
      <label>Tulis Jawaban / Pesan</label>
      <textarea id="emailBody" class="form-control" placeholder="Tulis balasan pesan di sini..." required>Halo Clara, terima kasih telah menghubungi Studio Flawless. Terkait pertanyaan Anda, </textarea>
    </div>

    <!-- Tombol Kirim (Menggunakan a href mailto) -->
    <div class="form-actions">
      <a href="admin-pesan.html" class="btn btn-outline">Batal</a>
      <a href="#" id="sendEmailBtn" class="btn">Kirim Pesan via Email</a>
    </div>

  </form>
</div>

<script>
// Skrip interaktif untuk menghubungkan input teks ke tautan mailto secara dinamis
const sendEmailBtn = document.getElementById('sendEmailBtn');
const recipientEmail = document.getElementById('recipientEmail');
const emailSubject = document.getElementById('emailSubject');
const emailBody = document.getElementById('emailBody');

sendEmailBtn.addEventListener('click', (e) => {
  e.preventDefault();
  
  const email = recipientEmail.value;
  const subject = encodeURIComponent(emailSubject.value);
  const body = encodeURIComponent(emailBody.value);

  // Membuka aplikasi email dengan data dari form
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
});
</script>

</body>
</html>
